version: '3.8'

services:
  # ==========================================
  # Banco de Dados de Desenvolvimento Local
  # (Use apenas para dev. Produção usa Neon)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: libpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: libpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d libpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
